name: JK Integrity CI

on:
  push:
    branches: ["main", "work/jk-recovery-wrongbook"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js data scripts -type f -name '*.js' -print0)
      - name: JK content and source integrity
        run: node scripts/validate-content-contract.js
