name: JK Integrity CI

on:
  push:
    branches: ["main", "work/jk-recovery-wrongbook"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js data scripts -type f -name '*.js' -print0)
      - name: JK content and source integrity
        run: node scripts/validate-content-contract.js
      - name: Start static server
        run: |
          nohup python3 -m http.server 4173 >/tmp/jk-http.log 2>&1 &
          echo $! > /tmp/jk-http.pid
          sleep 2
      - name: Wrongbook browser regression
        run: timeout 45s node scripts/wrongbook-browser-audit.mjs
      - name: Stop static server
        if: always()
        run: kill $(cat /tmp/jk-http.pid) || true
