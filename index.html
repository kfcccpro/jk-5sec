<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fa">
  <title>JK 5SEC Grammar</title>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">JK English</p>
        <h1>5초 영어어법</h1>
      </div>
      <div class="unit-badge" aria-label="현재 학습 단원">PART 1 · CH 1 · UNIT 1</div>
    </header>

    <main class="learning-wrap">
      <section class="progress-wrap" aria-label="학습 진행률">
        <div class="progress-meta">
          <span id="stageLabel">문제 풀기</span>
          <span id="progressText">1 / 5</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </section>

      <section class="task-card" aria-live="polite">
        <div id="taskContent"></div>
      </section>

      <div class="action-zone">
        <button id="primaryAction" class="primary-action" type="button" disabled>다음</button>
      </div>
    </main>
  </div>

  <script src="./js/app.js" defer></script>
</body>
</html>
